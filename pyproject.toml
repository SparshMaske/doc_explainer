[project]
name = "stratai"
version = "0.1.0"
description = "Local AI consulting research assistant demo (scope -> issue tree -> research -> verify -> synthesize)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "langgraph>=0.2",
    "httpx>=0.27",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "crawl4ai>=0.9.4",
    "diskcache>=5.6.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stratai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: needs running local services (Ollama, SearXNG, Crawl4AI browser)"]
